<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recycables and renewable</title>
</head>
<body>
  <h1>Business Data</h1>

  <!-- Connection status banner -->
  <p id="statusMsg" style="font-weight:bold;"></p>

  <form id="businessForm">
  Name: 
      <select id="name">
            <option value="bongani">Bongani</option>
            <option value="phuluso">Phuluso</option>
            <option value="muchinyani">Muchinyani</option>
             <option value="dineo">Dineo</option>
             <option value="mmawe">Mmawe</option>
             <option value="wamashudu">Wamashudu</option> 
  </select><br>
  Time: <input type="time" id="time"><br>
  Date: <input type="date" id="date"><br>
  Item: 
  <select id="item">
    <option value="Bottle">Bottle</option>
    <option value="Cash">Cash</option>
  </select><br>
  Bottles: <input type="number" id="bottles"><br>
  Amount (R): <input type="number" id="amount"><br>
  Stock 1: 
  <select id="stock1">
    <option value="snack">Snack</option>
            <option value="cigerattes">Cigerattes</option>
            <option value="sweets">Sweets</option>
            <option value="biscuits">Biscuits</option>
             <option value="g-vita">G-vita</option>
             <option value="-">-</option> 
  </select><br>
  Stock 2: 
  <select id="stock2">
     <option value="snack">Snack</option>
            <option value="cigerattes">Cigerattes</option>
            <option value="sweets">Sweets</option>
            <option value="biscuits">Biscuits</option>
             <option value="g-vita">G-vita</option>
             <option value="-">-</option> 
  </select><br>
  Stock 3: 
  <select id="stock3">
     <option value="snack">Snack</option>
            <option value="cigerattes">Cigerattes</option>
            <option value="sweets">Sweets</option>
            <option value="biscuits">Biscuits</option>
             <option value="g-vita">G-vita</option>
             <option value="-">-</option> 
  </select><br>
  Stock 4: 
  <select id="stock4">
     <option value="snack">Snack</option>
            <option value="cigerattes">Cigerattes</option>
            <option value="sweets">Sweets</option>
            <option value="biscuits">Biscuits</option>
             <option value="g-vita">G-vita</option>
            <option value="-">-</option> 
  </select><br>
  Total: <input type="number" id="total"><br>
  <button type="submit">Submit</button>
</form>
<h2>Entries Table</h2>
<table id="dataTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Time</th>
      <th>Date</th>
      <th>Item</th>
      <th>Bottles</th>
      <th>Amount</th>
      <th>Stock 1</th>
      <th>Stock 2</th>
      <th>Stock 3</th>
      <th>Stock 4</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<button id="clearBtn">Clear Data</button>

<!-- ===================== FIREBASE SETUP ===================== -->
<!-- 1. Go to https://console.firebase.google.com -->
<!-- 2. Create a free project -->
<!-- 3. Build > Firestore Database > Create database (start in test mode) -->
<!-- 4. Project settings > General > scroll to "Your apps" > Add app > Web (</>) -->
<!-- 5. Copy the firebaseConfig object Firebase gives you and paste it below, -->
<!--    replacing the placeholder values. -->
<!-- ============================================================ -->

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ===== PASTE YOUR FIREBASE CONFIG HERE =====
  const firebaseConfig = {
    apiKey: "AIzaSyDPgT-_LzWi24YX-Xid6oWtO_4PnTok6UA",
    authDomain: "recycables-business.firebaseapp.com",
    projectId: "recycables-business",
    storageBucket: "recycables-business.firebasestorage.app",
    messagingSenderId: "687229194820",
    appId: "1:687229194820:web:7d518ac639c6ec49256211"
  };
  // ============================================

  const statusMsg = document.getElementById('statusMsg');
  let db;
  let entriesCol;

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    entriesCol = collection(db, "businessEntries");
    statusMsg.textContent = "✅ Connected — data is shared across all devices.";
    statusMsg.style.color = "green";
  } catch (err) {
    statusMsg.textContent = "⚠️ Firebase not configured yet — data will NOT be shared across devices. See comments in the HTML file.";
    statusMsg.style.color = "red";
    console.error(err);
  }

  const form = document.getElementById('businessForm');
  const tableBody = document.querySelector('#dataTable tbody');

  async function loadEntries() {
    if (!entriesCol) return;
    tableBody.innerHTML = '';
    const q = query(entriesCol, orderBy("date"));
    const snapshot = await getDocs(q);
    snapshot.forEach((docSnap) => {
      addRow(docSnap.data());
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const entry = {
      name: document.getElementById('name').value.trim(),
      time: document.getElementById('time').value,
      date: document.getElementById('date').value,
      item: document.getElementById('item').value,
      bottles: document.getElementById('bottles').value,
      amount: document.getElementById('amount').value,
      stock1: document.getElementById('stock1').value,
      stock2: document.getElementById('stock2').value,
      stock3: document.getElementById('stock3').value,
      stock4: document.getElementById('stock4').value,
      total: document.getElementById('total').value,
    };

    if (!entry.name || !entry.time) {
      alert('Fill required fields!');
      return;
    }

    if (!entriesCol) {
      alert('Cannot save: Firebase is not configured yet. See the instructions in the HTML file.');
      return;
    }

    try {
      await addDoc(entriesCol, entry);
      form.reset();
      await loadEntries();
    } catch (err) {
      alert('Error saving entry: ' + err.message);
      console.error(err);
    }
  });

  function addRow(entry) {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${entry.name}</td>
      <td>${entry.time}</td>
      <td>${entry.date}</td>
      <td>${entry.item}</td>
      <td>${entry.bottles}</td>
      <td>${entry.amount}</td>
      <td>${entry.stock1}</td>
      <td>${entry.stock2}</td>
      <td>${entry.stock3}</td>
      <td>${entry.stock4}</td>
      <td>${entry.total}</td>
    `;
    tableBody.appendChild(row);
  }

  document.getElementById('clearBtn').addEventListener('click', async () => {
    if (!entriesCol) {
      alert('Firebase is not configured yet.');
      return;
    }
    if (!confirm('This will delete ALL entries for everyone. Continue?')) return;

    const snapshot = await getDocs(entriesCol);
    const deletions = snapshot.docs.map((d) => deleteDoc(d.ref));
    await Promise.all(deletions);
    tableBody.innerHTML = '';
    alert('Data cleared for everyone!');
  });

  // Load existing shared entries on page open
  loadEntries();
</script>

</body>
</html>
